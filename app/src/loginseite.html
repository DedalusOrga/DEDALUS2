<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – DEDALUS 2</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Hintergrundfarbe wie Willkommenseite */
        body {
            background-color: #EEF8EF; /* helles Grün */
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

<div class="text-center px-6">

    <!-- Titel -->
    <h1 class="text-4xl md:text-5xl font-bold text-green-900 mb-4">
        Willkommen zur DEDALUS 2
    </h1>

    <!-- Beschreibung → jetzt SCHWARZ -->
    <p class="text-lg mb-10 text-black">
        Hier können Sie sich sicher anmelden.
    </p>

    <!-- Login Formular -->
    <form class="max-w-sm mx-auto space-y-6">

        <!-- E-Mail -->
        <div class="text-left">
            <label class="block text-green-900 font-semibold mb-1">E-Mail</label>
            <input type="email"
                   class="w-full px-4 py-2 rounded-full border-2 focus:outline-none"
                   style="border-color: #2E5C4D;">
        </div>

        <!-- Passwort -->
        <div class="text-left">
            <label class="block text-green-900 font-semibold mb-1">Passwort</label>
            <input type="password"
                   class="w-full px-4 py-2 rounded-full border-2 focus:outline-none"
                   style="border-color: #2E5C4D;">
        </div>

        <!-- Button -->
        <button type="submit"
                class="w-full text-white py-3 rounded-full text-lg transition"
                style="background-color: #133F32;">
            Login
        </button>

    </form>
</div>

</body>

</html>
