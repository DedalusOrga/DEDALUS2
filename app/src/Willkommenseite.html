<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startseite – DEDALUS App</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #EEF8EF; /* helles Grün wie Figma */
        }
    </style>
</head>

<body class="min-h-screen flex items-center">

<div class="flex flex-col md:flex-row items-center justify-between w-full px-10 md:px-20">

    <!-- Linker Bereich (Text) -->
    <div class="max-w-xl">

        <!-- Überschrift -->
        <h1 class="text-4xl md:text-5xl font-bold text-green-900">
            Willkommen zur<br>DEDALUS App!
        </h1>

        <!-- Text darunter → Abstand mt-12 -->
        <p class="text-lg text-green-900 mt-12">
            Hier können Sie sich anmelden, um die Web-App zu nutzen.
        </p>

        <!-- Button → Abstand mt-10 -->
        <a href="loginseite.html"
           class="inline-block bg-green-900 text-white px-10 py-3 rounded-full text-lg mt-10">
            Anmelden
        </a>

    </div>

    <!-- Bild rechts -->
    <div class="mt-10 md:mt-0">
        <img src="/images/arzt.png" alt="Arzt" class="w-80 md:w-[380px]">
    </div>

</div>

</body>

</html>
